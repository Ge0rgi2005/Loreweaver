{% extends "base.html" %}

{% block content %}
<h1>Delete lore entry?</h1>
<p>Are you sure you want to delete "{{ entry }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm deletion</button>
    <a href="{% url 'lore:detail' entry.pk %}">Cancel</a>
</form>
{% endblock %}
