{% extends "base.html" %}

{% block content %}
<h1>Delete story?</h1>
<p>Are you sure you want to delete "{{ object.title }}"?</p>
<p>{{ cascade_warning }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm deletion</button>
    <a href="{% url 'stories:detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
