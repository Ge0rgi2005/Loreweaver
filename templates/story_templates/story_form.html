{% block title %}{% if story %}Edit story{% else %}Create a story{% endif %} | Loreweaver{% endblock %}

{% block content %}
<h1>{% if story %}Edit story{% else %}Create a story{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save story</button>
</form>
{% endblock %}
